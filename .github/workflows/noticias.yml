# A cada 3 horas: atualiza noticias.json com as notícias de Sorocaba para a tela inicial.
name: Atualizar notícias

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch: {}    # permite rodar na mão pela aba Actions

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias
        run: python scripts/atualizar_noticias.py

      - name: Salvar se mudou
        run: |
          if git diff --quiet -- noticias.json; then
            echo "Nenhuma notícia nova."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Notícias de Sorocaba atualizadas"
          git pull --rebase --autostash
          git push

# Todo dia às 7h (Brasília): atualiza vagas.json com as vagas de Análise de Dados e BI do portal Mentora Dados
# e dá um "oi" no banco do controle de mercado, para o Supabase gratuito não pausar o projeto.
name: Atualizar vagas

on:
  schedule:
    - cron: "0 10 * * *"   # 10h UTC = 7h em Brasília
  workflow_dispatch: {}    # permite rodar na mão pela aba Actions

permissions:
  contents: write

concurrency:
  group: vagas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manter o banco do controle de mercado acordado
        continue-on-error: true
        run: |
          curl -fsS -X POST "https://hofnhbxnfebfnncwxrds.supabase.co/rest/v1/rpc/ping"             -H "apikey: sb_publishable_kpEqdxunDeIbStJrgxrngg_tNPv6VTL"             -H "Content-Type: application/json" -d '{}' && echo " (banco respondeu)"

      - name: Buscar vagas no portal
        run: python scripts/atualizar_vagas.py

      - name: Salvar se mudou
        run: |
          if git diff --quiet -- vagas.json; then
            echo "Nenhuma mudança nas vagas hoje."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vagas.json
          git commit -m "Vagas atualizadas em $(TZ=America/Sao_Paulo date +%d/%m)"
          git push
